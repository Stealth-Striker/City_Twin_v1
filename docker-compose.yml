version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: citytwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citytwin
      POSTGRES_USER: citytwin_user
      POSTGRES_PASSWORD: citytwin_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citytwin_user -d citytwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citytwin-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://citytwin_user:citytwin_secure_password@postgres:5432/citytwin
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citytwin-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
